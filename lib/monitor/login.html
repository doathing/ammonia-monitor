<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 氨塔升温还原监测</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#172b4d;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif;padding:24px}.card{width:min(100%,420px);padding:36px;background:white;border:1px solid #e2e9f3;border-radius:20px;box-shadow:0 15px 45px #1933540d}.brand{display:inline-block;border-radius:14px;background:#2563eb;color:white;font-size:25px;font-weight:800;padding:12px 16px}h1{font-size:26px;margin:24px 0 8px}p{font-size:14px;color:#71819b;line-height:1.8}label{display:block;margin-top:20px;font-size:14px;font-weight:600}input{display:block;width:100%;font:inherit;padding:12px;border:1px solid #d3dfed;border-radius:9px;margin-top:8px}input:focus{outline:2px solid #93b9ff;outline-offset:2px}button{width:100%;border:0;border-radius:9px;color:white;background:#2563eb;padding:13px;font:inherit;font-weight:600;cursor:pointer;margin-top:24px}button:disabled{opacity:.6}#error{min-height:20px;color:#c43f48;font-size:14px;margin-top:16px}.foot{border-top:1px solid #edf1f7;padding-top:16px;margin:20px 0 0;font-size:12px}
</style></head><body><main class="card"><div class="brand">NH₃</div><h1>升温还原监测</h1><p>登录后查看还原计划、现场记录与综合趋势。</p><form id="login"><label>账号<input name="username" autocomplete="username" required maxlength="64" autofocus></label><label>密码<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">登录</button><div id="error" role="alert"></div></form><p class="foot">查看账号仅可浏览；编辑账号可录入和修改数据。<br>登录有效期为 8 小时，使用结束后请退出登录。</p></main><script>
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();const form=event.target,button=form.querySelector('button'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const data=new FormData(form);const response=await fetch('/api/session/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:data.get('username'),password:data.get('password')})});const result=await response.json();if(!response.ok)throw new Error(result.detail||'登录失败，请稍后重试。');location.replace('/');}catch(e){error.textContent=e.message;form.elements.password.value='';}finally{button.disabled=false;}});
</script></body></html>
